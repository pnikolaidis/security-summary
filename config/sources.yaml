# Sources for the nightly Channel Brief. Audience: cybersecurity resellers /
# channel partners selling product (CrowdStrike, Zscaler, Proofpoint, etc.) +
# advisory + pentest services. Lookback window is 24h unless noted.

lookback_hours: 24

rss:
  # Core security newsroom
  - name: krebs
    url: https://krebsonsecurity.com/feed/
  - name: bleepingcomputer
    url: https://www.bleepingcomputer.com/feed/
  - name: thehackernews
    url: https://feeds.feedburner.com/TheHackersNews
  - name: darkreading
    url: https://www.darkreading.com/rss.xml
  - name: securityweek
    url: https://feeds.feedburner.com/securityweek
  - name: schneier
    url: https://www.schneier.com/feed/atom/
  - name: msrc
    url: https://msrc.microsoft.com/blog/feed/
  - name: sans_isc
    url: https://isc.sans.edu/rssfeed.xml
  - name: risky_business_news
    url: https://news.risky.biz/feed/
  - name: kim_zetter_zero_day
    url: https://www.zetter-zeroday.com/feed
  - name: seriously_risky_business
    url: https://srslyriskybiz.substack.com/feed

  # Channel / business press — primary signal for this audience.
  # Vendor news, channel program changes, M&A, earnings, leadership moves.
  - name: crn_security
    url: https://www.crn.com/rss/security.xml
  - name: crn_channel_news
    url: https://www.crn.com/rss/channel-news.xml
  - name: mssp_alert
    url: https://www.msspalert.com/feed
  - name: channel_futures_cybersecurity
    url: https://www.channelfutures.com/category/mssp-insider/feed
  - name: techcrunch_security
    url: https://techcrunch.com/category/security/feed/
  - name: reuters_cybersecurity
    url: https://www.reuters.com/arc/outboundfeeds/rss/category/technology/cybersecurity/?outputType=xml
  - name: the_record
    url: https://therecord.media/feed/

reddit:
  # Practitioner sentiment ("our Zscaler renewal jumped 40%", "anyone replacing
  # Crowdstrike?") — keep light, this is supporting signal not the headline source.
  subreddits: [netsec, cybersecurity, msp, sysadmin, cybersecurity_news]
  limit_per_sub: 40
  min_score: 15

hackernews:
  min_score: 50
  query_tags: "story"
  keywords:
    # Threat / vuln headlines customers will ask about
    - security
    - vulnerability
    - exploit
    - ransomware
    - breach
    - cyberattack
    - zero-day
    # Commercial signals — M&A, earnings, channel, leadership
    - acquisition
    - acquires
    - earnings
    - layoffs
    - CISO
    - "channel partner"
    - "magic quadrant"
    # Named vendors most directly relevant to this audience
    - CrowdStrike
    - Zscaler
    - Proofpoint
    - Palo Alto Networks
    - SentinelOne
    - Fortinet
    - Okta
    - CyberArk
    - Netskope
    - Cloudflare
    - Wiz

mastodon:
  instance: infosec.exchange
  hashtags: [infosec, cybersecurity, threatintel, ransomware]
  limit_per_tag: 40

cisa:
  kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  advisories_rss: https://www.cisa.gov/cybersecurity-advisories/all.xml

nvd:
  # Higher floor: sales audience cares about vendor-of-interest CVEs, not the
  # NVD firehose. ROUTINE_PROMPT.md additionally drops NVD-only clusters that
  # don't hit a named vendor.
  min_cvss: 8.5
  results_per_page: 200

# YouTube channels — transcript text is fetched for each recent video and used as body.
# Requires www.youtube.com in the network allowlist.
# Skips channels already covered via RSS (e.g. SANS ISC).
youtube_channels:
  - name: cisa
    channel_id: UCxyq9roe-npgzrVwbpoAy0A
    description: "CISA — official US cybersecurity advisories and guidance"
  - name: mandiant
    channel_id: UCexu0DP7VKdDByusuTA53FQ
    description: "Mandiant (Google Cloud) — APT research and threat intelligence"
  - name: crowdstrike
    channel_id: UCsRdY9CtEVWTNO4ulwfzqVA
    description: "CrowdStrike — adversary intelligence and incident response"
  - name: unit42_paloalto
    channel_id: UCvJQO11qoCHYwZ4Ah4Jf-Tw
    description: "Unit 42 by Palo Alto Networks — threat research"
  - name: the_record_news
    channel_id: UCuBJQyzTWDP3C-BQTPG4DaQ
    description: "The Record from Recorded Future News — cybersecurity journalism"
  - name: cisco_talos
    channel_id: UCPZ1DtzQkStYBSG3GTNoyfg
    description: "Cisco Talos Intelligence Group — threat research"

