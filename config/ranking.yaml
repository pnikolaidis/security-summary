# Ranking weights for top-5 selection. Tuned for the channel reseller audience:
# vendor news + commercial signals + named-brand breaches outrank generic CVSS.

weights:
  diversity: 2.0          # log(1 + distinct_source_families)
  recency: 1.5            # exp(-hours_since_newest / 24)
  engagement: 1.0         # z-scored engagement_sum within source_family
  severity: 1.0           # CVSS / KEV / "actively exploited" — kept but no longer dominant
  novelty: 1.5            # subtracted if cluster touched in last 7d
  vendor_match: 1.5       # +1.0 per distinct vendor-of-interest in cluster (cap +3.0)
  commercial_signal: 2.5  # +0.5 per phrase from commercial_phrases, additive across phrases (cap +2.0)
  brand_breach: 2.0       # +1.0 if a named enterprise/brand/agency is the named victim

thresholds:
  min_cluster_size: 1
  min_score: 0.5
  top_n: 5
  # NVD-only clusters (source_families == {"nvd"}) are dropped unless at least
  # one vendor-of-interest token appears in the title. Enforced in ROUTINE_PROMPT.md.

severity_phrases:
  - "actively exploited"
  - "in the wild"
  - "zero-day"
  - "0-day"
  - "emergency patch"
  - "out-of-band patch"

# M&A, earnings, leadership, channel program, funding — drives the
# conversation-starter scoring boost.
commercial_phrases:
